<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zabbix Server Monitoring System</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Zabbix Server Monitoring</h1>
            <p class="subtitle">Zabbix API 를 통해 수집된 데이터를 받아 및 관리합니다.</p>
        </header>

        <div class="controls">
            <button id="syncBtn" class="btn-sync">Sync</button>
            <div class="table-controls">
                <label>
                    Show
                    <select id="rowsPerPage">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50" selected>50</option>
                        <option value="100">100</option>
                    </select>
                    rows
                </label>
                <span class="entries-info">전체 데이터 개수</span>
                <input type="text" id="searchInput" placeholder="Search:">
            </div>
        </div>

        <div class="table-wrapper">
            <table id="hostsTable">
                <thead>
                    <tr>
                        <th data-sort="hostId">Host ID</th>
                        <th data-sort="ip">IP</th>
                        <th data-sort="hostname">Hostname</th>
                        <th data-sort="serviceCode">Service Code</th>
                        <th data-sort="vendor">Vendor</th>
                        <th data-sort="arch">Architecture</th>
                        <th data-sort="kernel">Kernel</th>
                        <th data-sort="osVersion">OS Version</th>
                        <th data-sort="osVersionDetail">OS Version Detail</th>
                    </tr>
                </thead>
                <tbody id="hostsTableBody">
                    <!-- 데이터가 동적으로 로드됩니다 -->
                </tbody>
            </table>
        </div>

        <div class="pagination" id="pagination">
            <!-- 페이지네이션 버튼이 동적으로 생성됩니다 -->
        </div>

        <!-- 호스트 상세 정보 모달 -->
        <div id="hostDetailModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalHostName">호스트 상세 정보</h2>
                    <span class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="host-info">
                        <p><strong>Host ID:</strong> <span id="modalHostId"></span></p>
                        <p><strong>IP:</strong> <span id="modalIp"></span></p>
                        <p><strong>서비스코드:</strong> <span id="modalServiceCode"></span></p>
                    </div>
                    <h3>INFRA 아이템 목록</h3>
                    <div class="items-loading" id="itemsLoading">아이템 정보를 불러오는 중...</div>
                    <div class="items-wrapper" id="itemsWrapper" style="display: none;">
                        <table class="items-table">
                            <thead>
                                <tr>
                                    <th>아이템 이름</th>
                                    <th>마지막 값</th>
                                </tr>
                            </thead>
                            <tbody id="itemsTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
